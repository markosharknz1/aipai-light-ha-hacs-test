name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  hassfest:
    name: Home Assistant manifest (hassfest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    # This repo is public, so HACS can read file contents — blocking on purpose.
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
